spring.datasource.url=jdbc:jtds:sqlserver://tigo.makiro.com.bo/BDSistemaAntenaPM
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver

# Parametros extra para conexiones dinamicas por sucursal
app.datasource.params=
auth.login.validar-sucursal=false
auth.jwt.enabled=true
auth.jwt.access-ttl-minutes=480
auth.jwt.secret=${JWT_SECRET:CHANGE_ME_SUPER_SECRET_KEY}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://*.ngrok-free.app,https://*.ngrok-free.dev

# jTDS no soporta isValid(); Hikari requiere query de validación.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Conexion BD central (Conformacion Cuadrilla Confirmada)
app.central.datasource.url=jdbc:jtds:sqlserver://172.16.0.13/BDControlOrdenes
app.central.datasource.username=${spring.datasource.username}
app.central.datasource.password=${spring.datasource.password}
app.central.datasource.driver-class-name=${spring.datasource.driver-class-name}
app.central.datasource.hikari.connection-test-query=SELECT 1

# Conexion BD TigoHogar (Llamada de Atencion)
app.tigohogar.datasource.url=jdbc:jtds:sqlserver://181.188.148.59/BD_TigoHogar
app.tigohogar.datasource.username=${TIGOHOGAR_DB_USERNAME:}
app.tigohogar.datasource.password=${TIGOHOGAR_DB_PASSWORD:}
app.tigohogar.datasource.driver-class-name=${spring.datasource.driver-class-name}
app.tigohogar.datasource.hikari.connection-test-query=SELECT 1

# Carpeta local por servidor para imagenes de firmas llamada de atencion
app.llamada-atencion.firmas.dir=C:/imagenes_cuadrillas

# Notificacion por correo de cuadrillas no confirmadas
spring.mail.host=vps-1537170-x.dattaweb.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
